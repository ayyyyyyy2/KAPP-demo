<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Authentication</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <div class="container">
        <div class="form-toggle">
            <button id="loginBtn" class="toggle-btn active">Login</button>
            <button id="registerBtn" class="toggle-btn">Register</button>
        </div>
        
        <!-- Login Form -->
        <form id="loginForm" action="/login" method="POST">
            <h2>Login</h2>
            <label for="login_email">Email :</label>
            <input type="email" id="login_email" name="email" required>
            <label for="login_password">Password :</label>
            <input type="password" id="login_password" name="password" required>
            <button type="submit">Login</button>
        </form>
        
        <!-- Registration Form -->
        <form id="registerForm" action="/register" method="POST" style="display: none;">
            <h2>Register</h2>
            <label for="name">Name :</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email :</label>
            <input type="email" name="email" required>
            <label for="password">Password :</label>
            <input type="password" name="password" required>
            <p class="auto-regd-info">📝 Registration number will be automatically assigned</p>
            <button type="submit">Register</button>
        </form>
    </div>

    <button type="button" class="bug-report-btn" onclick="openBugReportModal()" aria-label="Report a bug">Bug</button>

    <div id="bugReportModal" class="bug-report-modal">
        <div class="bug-report-card">
            <button type="button" class="bug-report-close" onclick="closeBugReportModal()" aria-label="Close bug report">&times;</button>
            <h3>Report A Bug</h3>
            <p class="bug-report-copy">Send a bug report to `kappbysup@gmail.com`.</p>
            <label for="bugReportEmail">Your Email:</label>
            <input type="email" id="bugReportEmail" placeholder="you@example.com">
            <label for="bugReportSubject">Subject:</label>
            <input type="text" id="bugReportSubject" placeholder="Bug report">
            <label for="bugReportMessage">Message:</label>
            <textarea id="bugReportMessage" placeholder="Describe the issue..." required></textarea>
            <button type="button" class="bug-send-btn" onclick="sendBugReport()">Send</button>
        </div>
    </div>
    
    <script>
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const bugReportModal = document.getElementById('bugReportModal');
        
        loginBtn.addEventListener('click', () => {
            loginForm.style.display = 'flex';
            registerForm.style.display = 'none';
            loginBtn.classList.add('active');
            registerBtn.classList.remove('active');
        });
        
        registerBtn.addEventListener('click', () => {
            registerForm.style.display = 'flex';
            loginForm.style.display = 'none';
            registerBtn.classList.add('active');
            loginBtn.classList.remove('active');
        });
        
        // Handle registration form submission
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(registerForm);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert(result.message);
                    // Switch to login form
                    loginBtn.click();
                    registerForm.reset();
                } else {
                    alert(result.message);
                }
            } catch (error) {
                alert('Registration failed. Please try again.');
            }
        });

        function openBugReportModal() {
            bugReportModal.style.display = 'flex';
        }

        function closeBugReportModal() {
            bugReportModal.style.display = 'none';
        }

        function sendBugReport() {
            const email = document.getElementById('bugReportEmail').value.trim();
            const subjectInput = document.getElementById('bugReportSubject').value.trim();
            const message = document.getElementById('bugReportMessage').value.trim();

            if (!message) {
                alert('Please describe the bug before sending.');
                return;
            }

            const subject = subjectInput || 'Bug report';
            const body = [
                email ? `From: ${email}` : '',
                message
            ].filter(Boolean).join('\n\n');

            window.location.href = `mailto:kappbysup@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            closeBugReportModal();
        }

        window.addEventListener('click', (event) => {
            if (event.target === bugReportModal) {
                closeBugReportModal();
            }
        });
    </script>
</body>
</html>
